stages:
  - quality
  - test

default:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  interruptible: true

  before_script:
    - uv sync --locked

ruff:
  stage: quality

  script:
    - uv run ruff check .
    - uv run ruff format --check .

mypy:
  stage: quality

  script:
    - uv run mypy src

pytest:
  stage: test

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      libdbus-1-3
      libegl1
      libfontconfig1
      libgl1
      libglib2.0-0
      libxkbcommon-x11-0
    - uv sync --locked

  script:
    - >
      uv run pytest
      --cov
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --cov-fail-under=90
      --junitxml=junit.xml

  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

  artifacts:
    when: always
    expire_in: 1 week

    reports:
      junit: junit.xml

      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

    paths:
      - coverage.xml
