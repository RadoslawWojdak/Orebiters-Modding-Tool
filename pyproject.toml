[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "orebiters-modding-tool"
version = "0.1.0"
description = "A modding tool for my Orebiters game."
authors = [
    { name = "Radosław Wojdak" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[project.scripts]
orebiters-modding-tool = "orebiters_modding_tool.main:main"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["src/orebiters_modding_tool"]
